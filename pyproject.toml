[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-tstmd"
version = "0.1.0"
description = "Process-bigraph bridge to the real TST-MD hybrid cellular-Potts + bead-spring ECM engine (Tsingos et al. 2023), run CPU-only via Docker."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
dependencies = [
    "bigraph-schema>=1.4.4",
    "process-bigraph>=1.8.5",
    "numpy",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["pbg_tstmd"]

[tool.pytest.ini_options]
markers = ["docker: integration tests that require a running Docker daemon + the TST-MD image"]

[tool.uv.sources]
vivarium-workbench = { path = "/Users/eranagmon/code/vivarium-workbench", editable = true }
